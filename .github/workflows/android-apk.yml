name: Build Android APK (Sonelgaz Gaz Sidi Ali)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL HTTPS du serveur central (ex: https://votre-serveur.run.app)"
        required: false
        default: ""
      build_type:
        description: "Type d'APK à compiler"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Compiler APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configurer Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurer Android SDK (API 36)
        run: |
          SDK_BIN="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_BIN" ]; then
            SDK_BIN="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDK_BIN" --licenses > /dev/null || true
          "$SDK_BIN" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dépendances Node.js
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Compiler le frontend Web & PWA (dist/)
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.VITE_API_BASE_URL || 'https://ais-pre-oan75t3fojz7fuoroolwy3-633013075591.europe-west2.run.app' }}
        run: npm run build

      - name: Synchroniser Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          chmod +x android/gradlew

      - name: Décoder le Keystore de signature (si fourni dans les secrets GitHub)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/sonelgaz-release.jks"
            echo "ANDROID_KEYSTORE_PATH=${{ runner.temp }}/sonelgaz-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compiler l'APK Android Debug (installable directement)
        if: ${{ github.event.inputs.build_type != 'release' }}
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk ../apk-output/SONELGAZ-SIDI-ALI-v1.0.0-b${{ github.run_number }}-debug.apk

      - name: Compiler l'APK Android Release
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../apk-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../apk-output/SONELGAZ-SIDI-ALI-v1.0.0-b${{ github.run_number }}-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../apk-output/SONELGAZ-SIDI-ALI-v1.0.0-b${{ github.run_number }}-release-unsigned.apk
          fi

      - name: Publier l'APK en artefact GitHub téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: SONELGAZ-SIDI-ALI-android-apk
          path: apk-output/*.apk
          retention-days: 30
          if-no-files-found: error
